<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cameraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="200" height="200" rx="50" fill="url(#bgGradient)"/>
  
  <!-- Camera body -->
  <rect x="55" y="60" width="90" height="70" rx="8" fill="url(#cameraGradient)" stroke="none"/>
  
  <!-- Camera lens -->
  <circle cx="100" cy="95" r="22" fill="#1E40AF" opacity="0.1" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="100" cy="95" r="16" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="100" cy="95" r="10" fill="#0369A1"/>
  
  <!-- Recording indicator (red dot) -->
  <circle cx="145" cy="70" r="6" fill="#EF4444"/>
  <circle cx="145" cy="70" r="4" fill="#FCA5A5" opacity="0.6"/>
  
  <!-- Subtle play button overlay (bottom) -->
  <path d="M 95 130 L 105 135 L 95 140 Z" fill="#FFFFFF" opacity="0.7"/>
</svg>