<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bgGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="200" height="200" rx="50" fill="url(#bgGradient3)"/>
  
  <!-- Left code bracket -->
  <path d="M 60 70 L 55 70 L 55 130 L 60 130" stroke="#00D9FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right code bracket -->
  <path d="M 140 70 L 145 70 L 145 130 L 140 130" stroke="#00D9FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Record/Play icon in center -->
  <circle cx="100" cy="100" r="24" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
  <circle cx="100" cy="100" r="16" fill="#00D9FF" filter="url(#glow)"/>
  
  <!-- Play triangle inside record circle -->
  <path d="M 95 95 L 95 105 L 107 100 Z" fill="#1E40AF" stroke="none"/>
  
  <!-- Pulse rings -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.3"/>
</svg>