<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bgGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312E81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="200" height="200" rx="50" fill="url(#bgGradient4)"/>
  
  <!-- Outer frame (largest) -->
  <rect x="45" y="45" width="110" height="110" rx="12" fill="none" stroke="#06B6D4" stroke-width="3" opacity="0.6"/>
  
  <!-- Middle frame -->
  <rect x="60" y="60" width="80" height="80" rx="10" fill="none" stroke="#00D9FF" stroke-width="3" opacity="0.8"/>
  
  <!-- Inner frame -->
  <rect x="75" y="75" width="50" height="50" rx="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  
  <!-- Center circle with record dot -->
  <circle cx="100" cy="100" r="15" fill="#06B6D4" opacity="0.2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="100" cy="100" r="7" fill="#FFFFFF"/>
  
  <!-- Corner accents -->
  <circle cx="50" cy="50" r="4" fill="#00D9FF" opacity="0.7"/>
  <circle cx="150" cy="50" r="4" fill="#00D9FF" opacity="0.7"/>
  <circle cx="50" cy="150" r="4" fill="#00D9FF" opacity="0.7"/>
  <circle cx="150" cy="150" r="4" fill="#00D9FF" opacity="0.7"/>
</svg>